<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do - Banco de Horas</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <h1>To‑Do</h1>

    <form id="todo-form" class="todo-form" autocomplete="off" aria-label="Adicionar tarefa">
      <input id="todo-input" name="todo" placeholder="O que precisa fazer?" aria-label="Nova tarefa" />
      <button type="submit" id="add-btn">Adicionar</button>
    </form>

    <section class="controls">
      <div class="filters" role="tablist" aria-label="Filtros de tarefas">
        <button class="filter active" data-filter="all">Todas</button>
        <button class="filter" data-filter="active">Ativas</button>
        <button class="filter" data-filter="completed">Concluídas</button>
      </div>
      <div class="actions">
        <button id="clear-completed">Limpar concluídas</button>
      </div>
    </section>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="count"></span>
    </footer>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
